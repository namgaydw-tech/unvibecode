name: Track 1 C3 reproducibility evidence
on:
  push:
    branches: [track1-c3-repro-evidence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate:
    name: Analyze ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: khal
            repo: https://github.com/pimutils/khal.git
            sha: 3ba0fcef06d5244a4a7330869a8d5f18a0342ce9
          - target: pipx
            repo: https://github.com/pypa/pipx.git
            sha: e7fa855353cc8c15f199b746d5e4d93b69f3c889

    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      BROWSER: /bin/true

    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official UnvibeCode
        run: |
          set -euo pipefail
          python -m pip install --upgrade unvibecode
          mkdir -p evidence
          python --version > evidence/environment.txt
          python -m pip --version >> evidence/environment.txt
          python -m pip show unvibecode >> evidence/environment.txt
          git --version >> evidence/environment.txt
          python -m unvibecode --help > evidence/unvibecode-help.txt 2>&1
      - name: Checkout pinned public target
        run: |
          set -euo pipefail
          git clone --no-checkout "${{ matrix.repo }}" target
          git -C target checkout --detach "${{ matrix.sha }}"
          git -C target rev-parse HEAD > evidence/target-sha.txt
          find target -maxdepth 3 -type f -name '*.toml' -o -name 'setup.cfg' | sort > evidence/packaging-paths.txt
      - name: Run public repository review
        continue-on-error: true
        run: |
          set -uo pipefail
          timeout --signal=TERM --kill-after=20 1200 python -m unvibecode review --repository "$GITHUB_WORKSPACE/target" > evidence/review.log 2>&1
          result=$?
          echo "$result" > evidence/review-exit-code.txt
          echo "Exit status: $result"
          tail -n 80 evidence/review.log
          exit 0
      - name: Index generated artifacts
        if: always()
        run: |
          find "$GITHUB_WORKSPACE" -type f \( -name 'analysis-status.json' -o -name 'connections.jsonl' -o -name 'chunks.jsonl' -o -name '*workflow*.html' -o -name '*connected*.html' -o -name '*context*.zip' \) -print > evidence/artifact-index.txt || true
          sed -n '1,100p' evidence/artifact-index.txt
      - name: Print package version and inspect graph bundle
        if: always()
        run: |
          python -m pip show unvibecode
          python - <<'PY'
          from pathlib import Path
          import json, zipfile
          root = Path("unvibecode_results")
          focus = ("main_khal", "main_ikhal", "khal/__main__.py", "khal/cli.py", "pipx/__main__.py", "src/pipx/main.py", "pipx.main")
          output = {"result_root_exists": root.exists(), "bundles": [], "status": []}
          for p in root.rglob("analysis-status.json"):
              try:
                  obj = json.loads(p.read_text(encoding="utf-8"))
                  output["status"].append({"path": str(p), "overall_status": obj.get("overall_status"), "review_outcome": obj.get("review_outcome"), "keys": list(obj)})
              except Exception as error:
                  output["status"].append({"path": str(p), "error": str(error)})
          for p in root.rglob("*.zip"):
              if "context" not in p.name.lower():
                  continue
              zinfo = {"path": str(p), "files": [], "selected": []}
              with zipfile.ZipFile(p) as bundle:
                  for name in bundle.namelist():
                      zinfo["files"].append(name)
                      basename = name.rsplit("/", 1)[-1]
                      if basename not in ("connections.jsonl", "unresolved_relationships.jsonl"):
                          continue
                      lines = bundle.read(name).decode("utf-8", "replace").splitlines()
                      examples = [line[:950] for line in lines if any(term in line for term in focus)]
                      zinfo["selected"].append({"file": name, "total": len(lines), "matching": len(examples), "examples": examples[:28]})
              output["bundles"].append(zinfo)
          Path("evidence/graph-analysis.json").write_text(json.dumps(output, indent=2), encoding="utf-8")
          print(json.dumps(output, indent=2)[:29000])
          PY
      - name: Upload reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c3-${{ matrix.target }}-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            evidence/
            unvibecode_results/
            target/unvibecode_results/
